<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출결신고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script type="module" src="assets/api.js"></script>
<style>
  :root{--pri:#1d4ed8;--pri-d:#1e3a8a;--ink:#0f172a;--sub:#475569;--line:#e2e8f0;--bg:#eef2f7}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',-apple-system,sans-serif}
  header{background:var(--pri-d);color:#fff;padding:34px 20px 70px;text-align:center}
  header h1{margin:0;font-size:28px;letter-spacing:-.02em}
  header p{margin:8px 0 0;font-size:15px;opacity:.85}
  main{max-width:760px;margin:-46px auto 0;padding:0 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 6px 24px rgba(15,23,42,.08);display:flex;flex-direction:column}
  .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;margin-bottom:12px}
  .st .ic{background:#dbeafe}
  .tc .ic{background:#e2e8f0}
  .card h2{margin:0 0 4px;font-size:21px}
  .card p{margin:0 0 18px;color:var(--sub);font-size:14.5px;line-height:1.55;flex:1}
  .go{display:flex;align-items:center;justify-content:center;height:54px;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-family:inherit;width:100%}
  .go.dark{background:#334155}
  .pw{width:100%;height:50px;border:2px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:17px;margin-bottom:8px;font-family:inherit}
  .pw:focus{outline:0;border-color:var(--pri)}
  .err{color:#b91c1c;font-size:13.5px;min-height:19px;margin-bottom:4px}
  .note{grid-column:1/-1;text-align:center;font-size:13px;color:var(--sub);margin-top:4px}
  .demo{grid-column:1/-1;background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 14px;font-size:13.5px;text-align:center;display:none}
  @media (max-width:640px){main{grid-template-columns:1fr}header{padding:28px 16px 64px}header h1{font-size:24px}}
</style>
</head>
<body>
<header>
  <h1>출결신고서</h1>
  <p>결석·지각·조퇴·결과 신고를 온라인으로 작성하고 서명해 제출합니다</p>
</header>
<main>
  <div class="demo" id="demo">체험 모드입니다. 서버 연결 전이라 제출 내용은 이 기기에만 저장됩니다.</div>
  <section class="card st">
    <div class="ic">✍️</div>
    <h2>학생</h2>
    <p>출결신고서를 작성하고 학생과 보호자가 직접 서명해 담임선생님께 제출합니다.</p>
    <a class="go" href="student.html">신고서 작성하기</a>
  </section>
  <section class="card tc">
    <div class="ic">🔒</div>
    <h2>교사</h2>
    <p>제출된 신고서를 월별로 모아 보고, 확인서를 작성하고, 인쇄합니다.</p>
    <form id="tf">
      <input type="password" class="pw" id="pw" placeholder="교사 비밀번호" autocomplete="current-password" aria-label="교사 비밀번호">
      <div class="err" id="err"></div>
      <button class="go dark" id="enter">교사 화면 들어가기</button>
    </form>
  </section>
  <div class="note">학생은 '신고서 작성하기'를 눌러 주세요.</div>
</main>
<script>
(function () {
  var C = window.APP_CONFIG || {}, pw = document.getElementById('pw'), err = document.getElementById('err'), btn = document.getElementById('enter');
  apiReady.then(function (api) {
    if (api.mode === 'demo') document.getElementById('demo').style.display = 'block';
    return api.currentTeacher();
  }).then(function (who) {
    if (who) { pw.style.display = 'none'; btn.textContent = '교사 화면 열기 (로그인됨)'; btn.dataset.in = '1'; }
  });
  document.getElementById('tf').onsubmit = function (e) {
    e.preventDefault();
    if (btn.dataset.in) { location.href = 'admin.html'; return; }
    if (!pw.value) { err.textContent = '비밀번호를 입력하세요.'; pw.focus(); return; }
    if (C.firebase && C.firebase.apiKey && !C.teacherEmail) { location.href = 'admin.html'; return; }  // 이메일 미설정 시 교사 화면에서 이메일+비밀번호
    btn.disabled = true; btn.textContent = '확인 중…'; err.textContent = '';
    apiReady.then(function (api) { return api.adminLogin({ pw: pw.value }); })
      .then(function () { location.href = 'admin.html'; })
      .catch(function (e2) { err.textContent = (e2 && e2.message) || String(e2); btn.disabled = false; btn.textContent = '교사 화면 들어가기'; pw.select(); });
  };
})();
</script>
</body>
</html>
